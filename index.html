<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyEngine Ultra | AI Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --modal-bg: rgba(255, 255, 255, 0.8);
        }

        .dark {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
            --success: #34d399;
            --success-bg: #064e3b;
            --error: #f87171;
            --error-bg: #450a0a;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --modal-bg: rgba(15, 23, 42, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.2s, border-color 0.2s, color 0.2s; }
        
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        /* --- LAYOUT --- */
        .container { width: 100%; max-width: 650px; position: relative; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }

        /* --- HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em; }
        .brand span { color: var(--primary); }
        .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: 0.2s; }
        .icon-btn:hover { background: var(--border); }

        /* --- INPUTS --- */
        label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); margin-bottom: 8px; }
        textarea { width: 100%; height: 160px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; resize: none; outline: none; margin-bottom: 12px; line-height: 1.5; }
        textarea:focus { border-color: var(--primary); ring: 2px solid var(--primary); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        input[type="number"] { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-weight: 600; outline: none; }
        
        /* --- BUTTONS --- */
        .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--text); color: var(--bg); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--bg); }
        .btn-ai { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; border: none; font-weight: 700; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
        .btn-ai:hover { box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4); transform: translateY(-1px); }
        
        .review-group { display: flex; gap: 8px; }
        .btn-review { flex: 1; background: var(--primary); color: white; opacity: 0.5; cursor: not-allowed; }
        .btn-review.active { opacity: 1; cursor: pointer; }
        .btn-settings { width: 48px; background: var(--bg); border: 1px solid var(--border); color: var(--text-sub); cursor: pointer; border-radius: 12px; font-size: 1.1rem; }
        .btn-settings:hover { color: var(--text); border-color: var(--text); }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s; }
        .modal-card { background: var(--surface); width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); border: 1px solid var(--border); animation: slideUp 0.2s; }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .modal-desc { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 20px; }
        .prompt-box { width: 100%; height: 140px; background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-bottom: 20px; resize: none; }
        
        /* --- QUIZ & RESULTS --- */
        .hidden { display: none !important; }
        .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 24px; }
        .fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        
        .meta { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 12px; }
        .q-text { font-size: 1.2rem; font-weight: 700; line-height: 1.4; margin-bottom: 24px; }

        .options { display: grid; gap: 12px; }
        .opt { text-align: left; padding: 16px; border-radius: 12px; background: var(--bg); border: 2px solid transparent; color: var(--text); cursor: pointer; font-weight: 500; transition: 0.2s; }
        .opt:hover { border-color: var(--primary); }
        .opt.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 700; }
        .opt.wrong { background: var(--error-bg); border-color: var(--error); color: var(--error); animation: shake 0.4s; }

        .feedback { margin-top: 24px; padding: 20px; background: var(--bg); border-radius: 12px; border-left: 4px solid var(--primary); animation: slideUp 0.3s; }
        .keep-toggle { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); cursor: pointer; }
        
        /* --- MANAGER VIEW --- */
        .manager-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .list-container { max-height: 300px; overflow-y: auto; display: grid; gap: 8px; margin-bottom: 20px; padding-right: 5px; }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .list-item { display: flex; align-items: start; gap: 12px; padding: 12px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); transition: 0.2s; }
        .list-item:hover { border-color: var(--primary); }
        .list-item input { width: 18px; height: 18px; margin-top: 3px; cursor: pointer; accent-color: var(--primary); }
        .item-text { font-size: 0.85rem; font-weight: 500; line-height: 1.4; color: var(--text); flex: 1; }
        .item-streak { font-size: 0.7rem; font-weight: 700; background: var(--surface); padding: 2px 6px; border-radius: 4px; color: var(--text-sub); border: 1px solid var(--border); }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 32px 0; }
        .stat-card { background: var(--bg); padding: 20px; border-radius: 16px; text-align: center; }
        .stat-val { font-size: 2rem; font-weight: 800; color: var(--text); }
        .stat-lbl { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-top: 4px; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand"><span>⚡</span> StudyEngine</div>
            <button class="icon-btn" onclick="toggleTheme()">🌓</button>
        </header>

        <main id="view-setup" class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="font-weight: 700;">Setup Session</h2>
                <button class="btn btn-ai" style="width: auto; padding: 8px 16px; font-size: 0.8rem;" onclick="toggleAIModal(true)">✨ Create with AI</button>
            </div>
            
            <label>Question Source</label>
            <textarea id="json-input" placeholder='Paste JSON array here...'></textarea>
            
            <div class="row">
                <div>
                    <label>Questions <span id="count-badge" style="float: right; color: var(--primary);"></span></label>
                    <input type="number" id="q-limit" value="10" min="1">
                </div>
                <div>
                    <label>Review List</label>
                    <div class="review-group">
                        <button id="btn-review" class="btn btn-review" disabled onclick="startQuiz(true)">Empty</button>
                        <button class="btn-settings" onclick="openManager()" title="Manage Review List">⚙️</button>
                    </div>
                </div>
            </div>

            <div class="row" style="margin-bottom: 0;">
                <button class="btn btn-outline" onclick="document.getElementById('file-up').click()">📂 Browse File</button>
                <input type="file" id="file-up" accept=".json" class="hidden" onchange="handleFile(event)">
                <button class="btn btn-primary" onclick="startQuiz(false)">Start Session</button>
            </div>
        </main>

        <div id="ai-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-title"><span>✨</span> AI Question Generator</div>
                <p class="modal-desc">
                    1. Copy the prompt below.<br>
                    2. Paste it into ChatGPT, Gemini, or Claude.<br>
                    3. Paste the resulting JSON code back into StudyEngine.
                </p>
                <textarea id="prompt-text" class="prompt-box" readonly>Create a comprehensive JSON array of multiple choice questions covering ALL theoretical information in the provided text/slides. Order the questions strictly by the sequence of information in the source. Follow this exact schema: [{"question": "...", "options": ["A","B","C","D"] or ["True","False"], "answer": "A", "note": "Explanation"}]. Output ONLY raw JSON code, no markdown.</textarea>
                
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" onclick="toggleAIModal(false)">Close</button>
                    <button id="btn-copy" class="btn btn-primary" onclick="copyPrompt()">Copy Prompt</button>
                </div>
            </div>
        </div>

        <main id="view-manager" class="card hidden">
            <div class="manager-header">
                <h3 style="font-weight: 700;">Manage Review List</h3>
                <button class="btn btn-outline" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="closeManager()">✕ Close</button>
            </div>

            <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0;">
                    <input type="checkbox" id="select-all" onchange="toggleSelectAll()"> Select All
                </label>
                <span id="selected-count" style="font-size: 0.8rem; font-weight: 600; color: var(--text-sub);">0 Selected</span>
            </div>

            <div id="review-list-container" class="list-container">
                </div>

            <button class="btn" style="background: var(--error-bg); color: var(--error); border: 1px solid var(--error);" onclick="deleteSelected()">Delete Selected Items</button>
        </main>

        <main id="view-quiz" class="card hidden">
            <div class="progress"><div id="progress-bar" class="fill"></div></div>
            <div class="meta">
                <span id="tracker">0 / 0</span>
                <span id="timer">00:00</span>
            </div>
            
            <div id="q-text" class="q-text">Loading...</div>
            <div id="options" class="options"></div>

            <div id="feedback" class="feedback hidden">
                <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary); margin-bottom: 8px;">EXPLANATION</div>
                <p id="note" style="font-size: 0.9rem; line-height: 1.6;"></p>
                
                <label class="keep-toggle">
                    <input type="checkbox" id="keep-check">
                    Keep in Review List anyway
                </label>
                
                <button class="btn btn-primary" style="margin-top: 20px;" onclick="nextQ()">Next Question →</button>
            </div>
        </main>

        <main id="view-results" class="card hidden" style="text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 16px;">🏆</div>
            <h2 style="margin-bottom: 8px;">Session Complete</h2>
            
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-val" id="res-score">0%</div>
                    <div class="stat-lbl">Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="res-streak">0</div>
                    <div class="stat-lbl">Streak</div>
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="location.reload()">Return Home</button>
        </main>
    </div>

    <script>
        const DB_KEY = 'study_ultra_v8';
        let state = { pool: [], idx: 0, score: 0, timer: 0, interval: null, log: [] };

        // --- THEME ---
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // --- AI MODAL ---
        function toggleAIModal(show) {
            const el = document.getElementById('ai-modal');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function copyPrompt() {
            const txt = document.getElementById('prompt-text');
            txt.select();
            navigator.clipboard.writeText(txt.value);
            const btn = document.getElementById('btn-copy');
            const prev = btn.innerText;
            btn.innerText = "Copied! ✓";
            setTimeout(() => btn.innerText = prev, 2000);
        }

        // --- DATA INPUT ---
        document.getElementById('json-input').addEventListener('input', updateCount);
        
        function handleFile(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('json-input').value = ev.target.result;
                updateCount();
            };
            reader.readAsText(file);
        }

        function updateCount() {
            try {
                const data = JSON.parse(document.getElementById('json-input').value);
                const count = Array.isArray(data) ? data.length : 0;
                const limit = document.getElementById('q-limit');
                const badge = document.getElementById('count-badge');
                
                if (count > 0) {
                    badge.innerText = `Total: ${count}`;
                    limit.max = count;
                    limit.value = count;
                } else {
                    badge.innerText = '';
                }
            } catch {
                document.getElementById('count-badge').innerText = '';
            }
        }

        // --- MANAGER LOGIC ---
        function getDB() { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
        function setDB(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); updateReviewBtn(); }

        function updateReviewBtn() {
            const db = getDB();
            const btn = document.getElementById('btn-review');
            if (db.length > 0) {
                btn.innerText = `Practice Review (${db.length})`;
                btn.classList.add('active');
                btn.disabled = false;
            } else {
                btn.innerText = "Review List Empty";
                btn.classList.remove('active');
                btn.disabled = true;
            }
        }

        function openManager() {
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-manager').classList.remove('hidden');
            renderManagerList();
        }

        function closeManager() {
            document.getElementById('view-manager').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
        }

        function renderManagerList() {
            const db = getDB();
            const container = document.getElementById('review-list-container');
            container.innerHTML = '';

            if (db.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-sub)">No questions to manage.</div>`;
                return;
            }

            db.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <input type="checkbox" class="del-check" data-idx="${index}" onchange="updateSelCount()">
                    <div class="item-text">${item.question}</div>
                    <div class="item-streak">🔥 ${item.streak || 0}</div>
                `;
                container.appendChild(div);
            });
            updateSelCount();
        }

        function toggleSelectAll() {
            const master = document.getElementById('select-all').checked;
            document.querySelectorAll('.del-check').forEach(cb => cb.checked = master);
            updateSelCount();
        }

        function updateSelCount() {
            const count = document.querySelectorAll('.del-check:checked').length;
            document.getElementById('selected-count').innerText = `${count} Selected`;
        }

        function deleteSelected() {
            const checks = document.querySelectorAll('.del-check:checked');
            if (checks.length === 0) return alert("No questions selected.");
            
            if (!confirm(`Delete ${checks.length} questions from Review List?`)) return;

            const db = getDB();
            const indices = Array.from(checks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);
            
            indices.forEach(idx => db.splice(idx, 1));
            setDB(db);
            
            renderManagerList();
            document.getElementById('select-all').checked = false;
        }

        // --- QUIZ LOGIC ---
        function startQuiz(isReview) {
            try {
                if (isReview) {
                    state.pool = getDB();
                } else {
                    const txt = document.getElementById('json-input').value;
                    if (!txt.trim()) return alert("Please enter JSON data.");
                    const limit = parseInt(document.getElementById('q-limit').value);
                    state.pool = JSON.parse(txt).sort(() => Math.random() - 0.5).slice(0, limit);
                }
                if (!state.pool.length) throw "Empty";
            } catch { return alert("Invalid JSON or Empty List."); }

            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            
            state.idx = 0; state.score = 0; state.timer = 0;
            state.interval = setInterval(() => {
                state.timer++;
                const m = String(Math.floor(state.timer/60)).padStart(2,'0');
                const s = String(state.timer%60).padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
            
            renderQ();
        }

        function renderQ() {
            const q = state.pool[state.idx];
            document.getElementById('tracker').innerText = `${state.idx + 1} / ${state.pool.length}`;
            document.getElementById('progress-bar').style.width = `${(state.idx / state.pool.length)*100}%`;
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('keep-check').checked = false;

            const opts = document.getElementById('options');
            opts.innerHTML = '';
            
            [...q.options].sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt';
                btn.innerText = opt;
                btn.onclick = () => check(btn, opt, q);
                opts.appendChild(btn);
            });
        }

        function check(btn, sel, q) {
            document.querySelectorAll('.opt').forEach(b => b.disabled = true);
            const isCorr = sel === q.answer;
            state.log.push(isCorr);

            if (isCorr) {
                btn.classList.add('correct');
                state.score++;
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.opt').forEach(b => {
                    if (b.innerText === q.answer) b.classList.add('correct');
                });
            }
            
            document.getElementById('note').innerText = q.note || "No notes available.";
            document.getElementById('feedback').classList.remove('hidden');
        }

        function nextQ() {
            const q = state.pool[state.idx];
            const result = state.log[state.log.length-1];
            const force = document.getElementById('keep-check').checked;
            
            updateReviewDB(q, result, force);

            state.idx++;
            if (state.idx < state.pool.length) renderQ();
            else end();
        }

        function updateReviewDB(q, isCorr, force) {
            let db = getDB();
            let idx = db.findIndex(i => i.question === q.question);

            if (idx === -1) {
                if (!isCorr || force) db.push({ ...q, streak: (isCorr && !force) ? 1 : 0 });
            } else {
                if (force) db[idx].streak = 0;
                else if (isCorr) {
                    db[idx].streak = (db[idx].streak || 0) + 1;
                    if (db[idx].streak >= 2) db.splice(idx, 1);
                } else {
                    db[idx].streak = 0;
                }
            }
            setDB(db);
        }

        function end() {
            clearInterval(state.interval);
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-results').classList.remove('hidden');
            document.getElementById('res-score').innerText = `${Math.round((state.score/state.pool.length)*100)}%`;
            document.getElementById('res-streak').innerText = state.score;
        }

        // Init
        updateReviewBtn();
    </script>
</body>
</html>
