<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyEngine Ultra | Focus Mode</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e', // Success Green
                            600: '#16a34a',
                        },
                        accent: {
                            500: '#6366f1', // Indigo Focus
                            600: '#4f46e5',
                        },
                        surface: {
                            light: '#ffffff',
                            dark: '#0f172a', // Slate 900
                            card: '#1e293b', // Slate 800
                        }
                    },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base Reset */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Input Zoom Fix for iOS (No meta viewport hack needed) */
        input, textarea, select { font-size: 16px !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(51, 65, 85, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* Sticky Footer for Mobile Next Button */
        .sticky-footer {
            position: sticky;
            bottom: 0;
            background: linear-gradient(to top, var(--bg-color) 80%, transparent);
            padding-top: 20px;
            padding-bottom: 20px;
            margin-top: 20px;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-surface-dark dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 md:p-6" style="--bg-color: #f8fafc;">

    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-accent-500/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-brand-500/10 rounded-full blur-[100px]"></div>
    </div>

    <header class="w-full max-w-2xl flex justify-between items-center mb-6 relative z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-accent-600 flex items-center justify-center text-white font-bold shadow-lg shadow-accent-500/30">
                S
            </div>
            <h1 class="text-lg font-bold tracking-tight text-slate-700 dark:text-slate-200">StudyEngine</h1>
        </div>
        
        <div class="flex items-center gap-2 bg-white dark:bg-slate-800 p-1.5 rounded-full border border-slate-200 dark:border-slate-700 shadow-sm">
            <div id="streak-badge" class="hidden px-3 py-1 bg-orange-50 dark:bg-orange-900/20 text-orange-600 dark:text-orange-400 rounded-full text-xs font-bold items-center gap-1 transition-all">
                🔥 <span id="streak-count">0</span>
            </div>
            
            <div class="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>

            <button id="theme-toggle" class="p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 transition-colors" aria-label="Toggle Dark Mode">
                <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 24.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </header>

    <div class="w-full max-w-2xl relative z-10 transition-all duration-300">

        <main id="view-setup" class="glass-panel rounded-2xl p-6 md:p-8 animate-fade-in">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 dark:text-white">Session Setup</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Configure your learning material</p>
                </div>
                <button onclick="toggleModal(true)" class="text-xs font-medium text-accent-600 dark:text-accent-400 bg-accent-50 dark:bg-accent-900/20 px-3 py-1.5 rounded-lg hover:bg-accent-100 transition-colors flex items-center gap-1.5">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    AI Generator
                </button>
            </div>

            <div class="relative group mb-4">
                <textarea id="json-input" class="w-full h-48 p-4 rounded-xl bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-accent-500 focus:outline-none font-mono text-xs leading-relaxed resize-none text-slate-600 dark:text-slate-300 transition-shadow" placeholder="// Paste JSON here or use the AI Generator..."></textarea>
                <div id="input-status" class="absolute bottom-4 right-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-white dark:bg-slate-800 px-2 py-1 rounded border border-slate-200 dark:border-slate-700 shadow-sm">
                    Empty
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase">Question Count</label>
                    <div class="relative">
                        <input type="number" id="q-limit" class="w-full p-3 pl-4 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:border-accent-500 outline-none font-semibold text-sm transition-colors" min="1" value="10">
                        <span class="absolute right-4 top-3 text-xs text-slate-400">Questions</span>
                    </div>
                </div>
                
                <div class="flex items-end">
                    <button id="btn-mistakes" onclick="startQuiz(true)" disabled class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-dashed border-slate-300 dark:border-slate-600 text-slate-400 font-medium text-sm flex justify-center items-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:border-orange-400 hover:text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-900/10">
                        <span>↺</span> No Mistakes Saved
                    </button>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="loadSampleData()" class="px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                    Load Sample
                </button>
                <button onclick="startQuiz()" class="flex-1 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3 rounded-xl hover:shadow-lg hover:shadow-slate-500/20 transition-all transform active:scale-[0.98]">
                    Start Session
                </button>
            </div>
        </main>

        <main id="view-quiz" class="hidden glass-panel rounded-2xl overflow-hidden shadow-xl animate-fade-in flex flex-col">
            <div class="w-full h-1 bg-slate-100 dark:bg-slate-800">
                <div id="progress-bar" class="h-full bg-accent-600 transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <div class="p-6 md:p-8 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-6 text-xs font-mono text-slate-400">
                    <span id="question-tracker">01 / 10</span>
                    <span id="timer" class="bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">00:00</span>
                </div>

                <h2 id="question-text" class="text-lg md:text-xl font-bold leading-relaxed text-slate-800 dark:text-slate-100 mb-8"></h2>

                <div id="options-grid" class="grid gap-3 mb-6"></div>

                <div id="feedback-area" class="hidden bg-slate-50 dark:bg-slate-800/50 rounded-lg p-4 border-l-4 border-accent-500 animate-fade-in">
                    <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed mb-2"><strong class="text-slate-900 dark:text-white">Note:</strong> <span id="feedback-note"></span></p>
                    <p id="feedback-source" class="text-xs text-slate-400 font-mono italic"></p>
                </div>

                <div id="footer-actions" class="sticky-footer hidden">
                    <button onclick="nextQuestion()" class="w-full bg-accent-600 hover:bg-accent-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-accent-500/20 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                        Next Question <span class="text-lg">→</span>
                    </button>
                </div>
            </div>
        </main>

        <main id="view-results" class="hidden glass-panel rounded-2xl p-8 text-center animate-fade-in">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 mb-4 text-3xl">
                🏆
            </div>
            
            <h2 class="text-2xl font-bold mb-2 dark:text-white">Session Complete</h2>
            <p class="text-slate-500 text-sm mb-8">Review your performance below.</p>

            <div class="grid grid-cols-3 gap-3 mb-8">
                <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                    <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider mb-1">Score</div>
                    <div id="res-score" class="text-xl font-bold text-slate-800 dark:text-slate-100">0%</div>
                </div>
                <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                    <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider mb-1">Time</div>
                    <div id="res-time" class="text-xl font-bold text-slate-800 dark:text-slate-100">0:00</div>
                </div>
                <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                    <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider mb-1">Streak</div>
                    <div id="res-streak" class="text-xl font-bold text-orange-500">0</div>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="downloadCSV()" class="w-full py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold text-slate-600 dark:text-slate-300 text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                    Download Report (CSV)
                </button>
                <button onclick="location.reload()" class="w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3.5 rounded-xl hover:shadow-lg transition-all">
                    Start New Session
                </button>
            </div>
        </main>

    </div>

    <div id="ai-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="toggleModal(false)"></div>
        
        <div class="relative min-h-screen md:min-h-0 md:h-auto w-full md:w-[500px] bg-white dark:bg-slate-800 md:rounded-2xl shadow-2xl md:my-10 md:mx-auto p-6 flex flex-col transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold dark:text-white">AI Prompt Builder</h3>
                <button onclick="toggleModal(false)" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">&times;</button>
            </div>

            <div class="flex p-1 bg-slate-100 dark:bg-slate-900 rounded-lg mb-4">
                <button onclick="setPromptMode('convert')" id="tab-convert" class="flex-1 py-1.5 text-xs font-bold rounded shadow bg-white dark:bg-slate-700 text-slate-800 dark:text-white transition-all">Convert Data</button>
                <button onclick="setPromptMode('create')" id="tab-create" class="flex-1 py-1.5 text-xs font-bold rounded text-slate-500 hover:text-slate-700 transition-all">Create New</button>
            </div>

            <div class="relative flex-1 mb-4">
                <textarea id="prompt-output" readonly class="w-full h-40 md:h-32 p-3 text-xs bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg font-mono text-slate-600 dark:text-slate-400 focus:outline-none resize-none" onclick="this.select()"></textarea>
                <div class="absolute top-2 right-2 px-1.5 py-0.5 bg-slate-200 dark:bg-slate-800 text-[10px] font-bold rounded text-slate-500">READ ONLY</div>
            </div>

            <button onclick="copyPrompt()" class="w-full bg-accent-600 hover:bg-accent-700 text-white font-bold py-3 rounded-xl transition-colors">
                Copy to Clipboard
            </button>
        </div>
    </div>

    <script>
        /**
         * StudyEngine Ultra v2.0 - Optimized for Focus & Mobile
         */

        // --- STATE MANAGEMENT ---
        const state = {
            questions: [],
            pool: [],
            idx: 0,
            score: 0,
            streak: 0,
            timer: 0,
            interval: null,
            log: [],
            mistakesKey: 'studyengine_mistakes_v2'
        };

        const dom = {
            views: { setup: document.getElementById('view-setup'), quiz: document.getElementById('view-quiz'), results: document.getElementById('view-results') },
            input: document.getElementById('json-input'),
            status: document.getElementById('input-status'),
            qLimit: document.getElementById('q-limit'),
            mistakesBtn: document.getElementById('btn-mistakes'),
            streakBadge: document.getElementById('streak-badge'),
            streakCount: document.getElementById('streak-count'),
            themeToggle: document.getElementById('theme-toggle'),
            footer: document.getElementById('footer-actions')
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- THEME & INIT ---
        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
            updateThemeIcon(isDark);
            updateBgColor(isDark);
        }
        
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
            updateBgColor(isDark);
        }

        function updateThemeIcon(isDark) {
            document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
            document.getElementById('icon-moon').classList.toggle('hidden', isDark);
        }

        function updateBgColor(isDark) {
            document.body.style.setProperty('--bg-color', isDark ? '#0f172a' : '#f8fafc');
        }

        dom.themeToggle.addEventListener('click', toggleTheme);
        initTheme();
        checkMistakes();

        // --- INPUT HANDLING ---
        dom.input.addEventListener('input', () => {
            const txt = dom.input.value.trim();
            if (!txt) {
                setStatus('Empty', 'neutral');
                return;
            }
            try {
                const data = JSON.parse(txt);
                if (Array.isArray(data)) {
                    setStatus(`Ready (${data.length} Qs)`, 'success');
                    dom.qLimit.max = data.length;
                    dom.qLimit.value = Math.min(data.length, 20);
                } else {
                    setStatus('Not an Array', 'error');
                }
            } catch (e) {
                setStatus('Invalid JSON', 'error');
            }
        });

        function setStatus(msg, type) {
            dom.status.innerText = msg;
            const colors = {
                neutral: 'text-slate-400 border-slate-200 bg-white',
                success: 'text-green-600 border-green-200 bg-green-50',
                error: 'text-red-500 border-red-200 bg-red-50'
            };
            dom.status.className = `absolute bottom-4 right-4 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded border shadow-sm ${colors[type]}`;
        }

        function loadSampleData() {
            const sample = [
                { "question": "What is the primary visual principle used to guide the user's eye?", "options": ["Hierarchy", "Saturation", "Kerning", "Leading"], "answer": "Hierarchy", "note": "Visual hierarchy organizes elements by importance.", "source": "UX Foundations" },
                { "question": "Which CSS unit is relative to the viewport width?", "options": ["vw", "rem", "em", "%"], "answer": "vw", "note": "1vw = 1% of the viewport width.", "source": "MDN" }
            ];
            dom.input.value = JSON.stringify(sample, null, 2);
            dom.input.dispatchEvent(new Event('input'));
        }

        // --- ENGINE LOGIC ---
        function checkMistakes() {
            const db = JSON.parse(localStorage.getItem(state.mistakesKey) || '[]');
            if (db.length > 0) {
                dom.mistakesBtn.disabled = false;
                dom.mistakesBtn.classList.remove('text-slate-400', 'border-slate-300');
                dom.mistakesBtn.classList.add('text-orange-600', 'border-orange-300', 'bg-orange-50');
                dom.mistakesBtn.innerHTML = `<span>↺</span> Review ${db.length} Mistake${db.length > 1 ? 's' : ''}`;
            }
        }

        function startQuiz(isReview = false) {
            // Resume Audio
            if (audioCtx.state === 'suspended') audioCtx.resume();

            try {
                if (isReview) {
                    state.questions = JSON.parse(localStorage.getItem(state.mistakesKey) || '[]');
                    if (!state.questions.length) return alert("No mistakes found.");
                    // Shuffle
                    state.questions.sort(() => Math.random() - 0.5);
                } else {
                    const raw = JSON.parse(dom.input.value);
                    if (!raw || !raw.length) return alert("Invalid Input");
                    state.questions = raw.sort(() => Math.random() - 0.5).slice(0, parseInt(dom.qLimit.value));
                }
            } catch (e) { return alert("Please check your JSON data."); }

            // Reset State
            state.pool = state.questions;
            state.idx = 0; state.score = 0; state.streak = 0; state.timer = 0; state.log = [];
            
            // Switch Views
            dom.views.setup.classList.add('hidden');
            dom.views.quiz.classList.remove('hidden');
            dom.streakBadge.classList.remove('hidden');
            dom.streakCount.innerText = "0";

            // Start Timer
            clearInterval(state.interval);
            state.interval = setInterval(() => {
                state.timer++;
                const m = Math.floor(state.timer / 60).toString().padStart(2, '0');
                const s = (state.timer % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);

            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestion() {
            const q = state.pool[state.idx];
            document.getElementById('question-tracker').innerText = `${String(state.idx + 1).padStart(2, '0')} / ${state.pool.length}`;
            document.getElementById('progress-bar').style.width = `${(state.idx / state.pool.length) * 100}%`;
            document.getElementById('question-text').innerText = q.question;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            // Shuffle options
            const opts = [...q.options].sort(() => Math.random() - 0.5);
            
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-accent-400 transition-all shadow-sm active:scale-[0.99]";
                btn.innerHTML = `<span class="pointer-events-none font-medium text-slate-700 dark:text-slate-200 text-sm md:text-base">${opt}</span>`;
                btn.onclick = () => handleAnswer(btn, opt, q);
                grid.appendChild(btn);
            });

            // Reset UI for new question
            document.getElementById('feedback-area').classList.add('hidden');
            dom.footer.classList.add('hidden');
        }

        function handleAnswer(btn, selected, q) {
            // Lock options
            const allBtns = document.getElementById('options-grid').children;
            for (let b of allBtns) b.disabled = true;

            const isCorrect = selected === q.answer;
            state.log.push({ q: q.question, result: isCorrect, time: document.getElementById('timer').innerText });

            if (isCorrect) {
                playTone('success');
                btn.classList.add('ring-2', 'ring-green-500', 'bg-green-50', 'dark:bg-green-900/20', 'border-green-500');
                state.score++;
                state.streak++;
                // Remove from mistakes if present
                updateMistakeDB(q, 'remove');
            } else {
                playTone('error');
                btn.classList.add('ring-2', 'ring-red-500', 'bg-red-50', 'dark:bg-red-900/20', 'border-red-500', 'animate-shake');
                state.streak = 0;
                // Highlight correct
                for (let b of allBtns) {
                    if (b.innerText === q.answer) {
                        b.classList.add('ring-2', 'ring-green-500', 'bg-green-50', 'dark:bg-green-900/20');
                    }
                }
                updateMistakeDB(q, 'add');
            }
            
            dom.streakCount.innerText = state.streak;

            // Show Feedback
            const feedbackArea = document.getElementById('feedback-area');
            if (q.note || q.source) {
                feedbackArea.classList.remove('hidden');
                document.getElementById('feedback-note').innerText = q.note || "No explanation provided.";
                document.getElementById('feedback-source').innerText = q.source ? `Source: ${q.source}` : "";
            }

            // Show Next Button
            dom.footer.classList.remove('hidden');
            
            // Auto-scroll on mobile if needed
            if (window.innerWidth < 768) {
                dom.footer.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
        }

        function nextQuestion() {
            state.idx++;
            if (state.idx < state.pool.length) {
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                endSession();
            }
        }

        function endSession() {
            clearInterval(state.interval);
            dom.views.quiz.classList.add('hidden');
            dom.views.results.classList.remove('hidden');
            
            const pct = Math.round((state.score / state.pool.length) * 100);
            document.getElementById('res-score').innerText = `${pct}%`;
            document.getElementById('res-time').innerText = document.getElementById('timer').innerText;
            document.getElementById('res-streak').innerText = state.streak;
            
            checkMistakes(); // Update count
        }

        // --- UTILS ---
        function updateMistakeDB(q, action) {
            let db = JSON.parse(localStorage.getItem(state.mistakesKey) || '[]');
            if (action === 'add') {
                if (!db.some(i => i.question === q.question)) db.push(q);
            } else {
                db = db.filter(i => i.question !== q.question);
            }
            localStorage.setItem(state.mistakesKey, JSON.stringify(db));
        }

        function playTone(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        }

        function downloadCSV() {
            let csv = "Question,Result,Time\n";
            state.log.forEach(r => csv += `"${r.q.replace(/"/g, '""')}",${r.result ? 'Correct' : 'Incorrect'},${r.time}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `study_session_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        // --- MODAL ---
        const prompts = {
            convert: `Convert this list to a JSON array of objects with keys: "question", "options" (4 strings), "answer" (string), "note" (short explanation), and "source". Output ONLY raw JSON.`,
            create: `Generate [NUMBER] multiple-choice questions about [TOPIC] as a JSON array. Keys: "question", "options", "answer", "note", "source". Output ONLY raw JSON.`
        };

        function toggleModal(show) {
            const el = document.getElementById('ai-modal');
            if (show) {
                el.classList.remove('hidden');
                setPromptMode('convert');
            } else {
                el.classList.add('hidden');
            }
        }

        function setPromptMode(mode) {
            const btn1 = document.getElementById('tab-convert');
            const btn2 = document.getElementById('tab-create');
            
            if (mode === 'convert') {
                btn1.className = "flex-1 py-1.5 text-xs font-bold rounded shadow bg-white dark:bg-slate-700 text-slate-800 dark:text-white transition-all";
                btn2.className = "flex-1 py-1.5 text-xs font-bold rounded text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-all";
                document.getElementById('prompt-output').value = prompts.convert;
            } else {
                btn2.className = "flex-1 py-1.5 text-xs font-bold rounded shadow bg-white dark:bg-slate-700 text-slate-800 dark:text-white transition-all";
                btn1.className = "flex-1 py-1.5 text-xs font-bold rounded text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-all";
                document.getElementById('prompt-output').value = prompts.create;
            }
        }

        function copyPrompt() {
            const el = document.getElementById('prompt-output');
            el.select();
            navigator.clipboard.writeText(el.value);
            const btn = document.querySelector('#ai-modal button:last-child');
            const prev = btn.innerText;
            btn.innerText = "Copied! ✓";
            setTimeout(() => btn.innerText = prev, 1500);
        }
    </script>
</body>
